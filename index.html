<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,initial-scale=1"><title>Cosmos</title>
<style>html,body{margin:0;height:100%;background:#000}</style></head>
<body><script>
/* Chargeur Cosmos : récupère la dernière version de l'interface (app.html) sur GitHub, sinon la dernière copie gardée. */
(function(){var U='https://raw.githubusercontent.com/NonoBubu33/cosmos-tv/main/app.html',K='cosmos.app.html',c=null,done=false;
try{c=localStorage.getItem(K)}catch(e){}
function go(h){if(done)return;done=true;document.open();document.write(h);document.close();}
function fb(){if(c)go(c);else{done=true;location.replace('app.html');}}
var x=new XMLHttpRequest();x.open('GET',U);x.timeout=5000;
x.onload=function(){var h=x.responseText;if(x.status===200&&h.indexOf('var PH=')>-1){try{localStorage.setItem(K,h)}catch(e){}go(h);}else fb();};
x.onerror=x.ontimeout=fb;try{x.send()}catch(e){fb()}})();
</script></body></html>
