<title>Cosmos</title>
<style>
/* Écran d'accueil TV, thème Cosmos — compatible Tizen 6.5 (Chromium 85). Les photos 4K sont chargées depuis NASA/ESA/Wikimedia et cadrées sur la télé. */
:root{--k:1;--or:#C9A86C;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#f4efe6;font-family:"SamsungOne","Samsung Sans",Inter,"Segoe UI",system-ui,sans-serif;cursor:default}
.bg{position:fixed;inset:0;overflow:hidden;background:#000}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease}
.scene.on{opacity:1}
.scene canvas{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.0)}
.scene.on canvas{animation:kb 18s linear forwards}
.scene.on.alt canvas{animation-name:kb2}
@keyframes kb{from{transform:scale(1.0) translate(0,0)}to{transform:scale(1.07) translate(-1%,-.6%)}}
@keyframes kb2{from{transform:scale(1.07) translate(1%,.6%)}to{transform:scale(1.0) translate(0,0)}}
.shade{position:fixed;left:0;right:0;bottom:0;height:calc(260px*var(--k));pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.45))}
.cap{position:fixed;left:calc(64px*var(--k));bottom:calc(52px*var(--k));transition:opacity 1s ease,transform .4s ease;text-shadow:0 1px calc(8px*var(--k)) rgba(0,0,0,.7)}
.cap.hide{opacity:0}
.cap b{display:block;font-size:calc(24px*var(--k));font-weight:500;letter-spacing:calc(.3px*var(--k));color:rgba(255,255,255,.88)}
.cap small{display:block;margin-top:calc(4px*var(--k));font-size:calc(13px*var(--k));font-weight:400;letter-spacing:calc(.6px*var(--k));color:rgba(255,255,255,.45)}
.clk{position:fixed;right:calc(64px*var(--k));bottom:calc(52px*var(--k));text-align:right;transition:transform .4s ease;text-shadow:0 1px calc(8px*var(--k)) rgba(0,0,0,.7)}
.clk .t{font-size:calc(30px*var(--k));font-weight:300;letter-spacing:calc(.5px*var(--k));font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85);line-height:1}
.clk .d{margin-top:calc(6px*var(--k));font-size:calc(13px*var(--k));letter-spacing:calc(.6px*var(--k));color:rgba(255,255,255,.45);text-transform:capitalize}
.band{position:fixed;left:0;right:0;bottom:0;height:calc(150px*var(--k));padding:0 calc(64px*var(--k));display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.72) 45%);transform:translateY(100%);opacity:0;transition:transform .35s ease,opacity .35s ease}
body.ui .band{transform:none;opacity:1}
body.ui .cap,body.ui .clk{transform:translateY(calc(-175px*var(--k)))}
.grp{display:flex;gap:calc(26px*var(--k));align-items:center}
.app{all:unset;position:relative;width:calc(76px*var(--k));height:calc(76px*var(--k));border-radius:calc(20px*var(--k));display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.06);border:calc(1.5px*var(--k)) solid rgba(255,255,255,.14);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.app .ico{width:calc(56px*var(--k));height:calc(56px*var(--k));border-radius:calc(15px*var(--k));display:grid;place-items:center;color:#fff}
.app .ico svg{width:calc(36px*var(--k));height:calc(36px*var(--k))}
.app .lbl{position:absolute;left:50%;bottom:calc(98px*var(--k));transform:translate(-50%,calc(6px*var(--k)));white-space:nowrap;font-size:calc(20px*var(--k));font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.app .hd{position:absolute;bottom:calc(-20px*var(--k));left:50%;transform:translateX(-50%);white-space:nowrap;font-size:calc(11px*var(--k));font-weight:600;letter-spacing:calc(1.5px*var(--k));color:rgba(255,255,255,.5)}
.app.on{transform:translateY(calc(-6px*var(--k))) scale(1.08);border-color:var(--or);box-shadow:0 0 calc(24px*var(--k)) rgba(201,168,108,.3)}
.app.on .lbl{opacity:1;transform:translate(-50%,0)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:calc(18px*var(--k)) calc(32px*var(--k));border-radius:calc(16px*var(--k));background:rgba(0,0,0,.7);font-size:calc(24px*var(--k));opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

 {nm:'Switch',c:'#e4000f',hd:'HDMI 4',ic:'<path d="M11 3.5v12.5H4.5z"/><path d="M13 6.5v9.5h5.5z"/><path d="M3 18h18"/><path d="'+W+'"/>'}
];

 b.innerHTML='<span class="ico" style="background:'+a.c+'"><svg viewBox="0 0 24 24" '+G+'>'+a.ic+'</svg></span><span class="lbl">'+a.nm+'</span>'+(a.hd?'<span class="hd">'+a.hd+'</span>':'');
 b.addEventListener('click',function(){if(sel===i)launch();else pick(i);wake();});document.getElementById(a.hd?'hdmi':'apps').appendChild(b);els.push(b);});

var tt;function toast(m,d){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},d||2200);}
var KEY={'Netflix':'netflix','Prime Video':'prime','YouTube':'youtube'};
var SVC='http://127.0.0.1:8097/';
function launch(){var a=APPS[sel];
 var path=a.hd?'source/hdmi/'+a.hd.replace(/\D/g,''):(a.nm==='TV'?'source/tv/1':'launch/'+KEY[a.nm]);
 toast((a.hd?'Passage sur '+a.hd+' — ':(a.nm==='TV'?'Passage sur la ':'Ouverture de '))+a.nm+'…',4000);
 var x=new XMLHttpRequest();x.open('GET',SVC+path);x.timeout=8000;
 x.onload=function(){var r={};try{r=JSON.parse(x.responseText);}catch(e){}if(!r.ok)toast(a.nm+' : '+(r.error||'erreur '+x.status),5000);};
 x.onerror=x.ontimeout=function(){toast('Service Cosmos non démarré — relance Cosmos depuis TizenBrew',5000);};
 x.send();}
APPS.forEach(function(a,i){var k=KEY[a.nm];if(!k)return;var im=new Image();im.onload=function(){var s=els[i].querySelector('.ico');s.style.background='transparent';s.innerHTML='';im.style.cssText='width:100%;height:100%;object-fit:contain;border-radius:inherit';s.appendChild(im);};im.src=SVC+'icon/'+k;});
var hideT;function wake(){document.body.classList.add('ui');clearTimeout(hideT);hideT=setTimeout(function(){document.body.classList.remove('ui')},8000);}
function key(k){var ui=document.body.classList.contains('ui');
 if(!ui){if(k==='ArrowRight'){go(1);return;}if(k==='ArrowLeft'){go(-1);return;}wake();return;}
 wake();if(k==='ArrowRight')pick(sel+1);else if(k==='ArrowLeft')pick(sel-1);else if(k==='Enter')launch();else if(k==='ArrowDown'||k==='Escape'){document.body.classList.remove('ui');}}
try{if(typeof tizen!=='undefined')['MediaPlayPause','ChannelUp','ChannelDown'].forEach(function(k){try{tizen.tvinputdevice.registerKey(k);}catch(e){}});}catch(e){}
document.addEventListener('keydown',function(e){
 if(e.keyCode===10009){if(document.body.classList.contains('ui'))document.body.classList.remove('ui');else{try{tizen.application.getCurrentApplication().exit();}catch(x){}}e.preventDefault();return;}
 if(e.keyCode===427){go(1);e.preventDefault();return;}if(e.keyCode===428){go(-1);e.preventDefault();return;}
 var m={37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown',13:'Enter',27:'Escape'}[e.keyCode];if(m){key(m);e.preventDefault();}});

function bbox(img){var s=400/Math.max(img.width,img.height),w=Math.round(img.width*s),h=Math.round(img.height*s),c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(img,0,0,w,h);var d=x.getImageData(0,0,w,h).data,x0=w,y0=h,x1=0,y1=0;for(var y=0;y<h;y++)for(var X=0;X<w;X++){var i=(y*w+X)*4;if(d[i]*.3+d[i+1]*.59+d[i+2]*.11>28){if(X<x0)x0=X;if(X>x1)x1=X;if(y<y0)y0=y;if(y>y1)y1=y;}}return [x0/s,y0/s,(x1+1)/s,(y1+1)/s];}
function load(n,cb){if(cache[n]){cb(cache[n]);return;}var im=new Image();im.crossOrigin='anonymous';im.onload=function(){cache[n]=im;cb(im);};im.onerror=function(){cb(null);};im.src=PH[n].s;}
function paint(cv,p,img){var W=cv.width,H=cv.height,x=cv.getContext('2d');x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.fillStyle='#000';x.fillRect(0,0,W,H);x.imageSmoothingQuality='high';
 if(p.m==='c'){var s=Math.max(W/img.width,H/img.height),dw=img.width*s,dh=img.height*s;x.drawImage(img,(W-dw)/2,(H-dh)*p.f,dw,dh);return;}

 tx.globalCompositeOperation='destination-in';var ox=(b[0]-sx)*s,oy=(b[1]-sy)*s,cx=ox+bw*s/2,cy=oy+bh*s/2,rx=(bw*s)/2+pad*s*.85,ry=(bh*s)/2+pad*s*.85;tx.save();tx.translate(cx,cy);tx.scale(1,ry/rx);var g=tx.createRadialGradient(0,0,rx*0.92,0,0,rx);g.addColorStop(0,'#000');g.addColorStop(1,'rgba(0,0,0,0)');tx.fillStyle=g;tx.fillRect(-4*rx,-4*rx,8*rx,8*rx);tx.restore();
