:root{--ac:#E9C98B}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f6f1e7;font-family:"SamsungOne","Samsung Sans",Inter,"Segoe UI",system-ui,sans-serif;cursor:none}
.ph{position:fixed;inset:0;opacity:0;transition:opacity 1.6s ease;will-change:opacity}
.ph.on{opacity:1;z-index:1}
.ph.off{opacity:0;z-index:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform;transform:scale(1)}
.ph.on img,.ph.off img{animation:kb 24s linear forwards}
body.bg .ph img{animation-play-state:paused}
.ph.r.on img,.ph.r.off img{animation-name:kb2}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.04)}}
@keyframes kb2{from{transform:scale(1.04)}to{transform:scale(1)}}
.topv{position:fixed;left:0;top:0;width:900px;height:260px;background:radial-gradient(ellipse at 0 0,rgba(0,0,0,.42),rgba(0,0,0,0) 70%);opacity:0;transition:opacity 1s;z-index:2;pointer-events:none}
.botv{position:fixed;left:0;right:0;bottom:0;height:380px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.32) 40%,rgba(0,0,0,.8));z-index:2;pointer-events:none;opacity:.55;transition:opacity .45s}
body.ui .botv{opacity:1}
.hi{position:fixed;left:84px;top:66px;z-index:3;text-shadow:0 2px 14px rgba(0,0,0,.55);opacity:0;transition:opacity 1.2s}
.hi b{display:block;font-size:44px;font-weight:300;letter-spacing:.3px}
.hi small{display:block;margin-top:8px;font-size:22px;color:rgba(255,255,255,.8)}
body.hello .hi,body.hello .topv{opacity:1}
.cap{position:fixed;left:84px;bottom:64px;z-index:3;text-shadow:0 1px 10px rgba(0,0,0,.75);transition:opacity .6s}
.cap b{display:block;font-size:28px;font-weight:500;color:rgba(255,255,255,.94)}
.cap small{display:block;margin-top:6px;font-size:20px;color:rgba(255,255,255,.68)}
body.ui .cap{opacity:0}
.clk{position:fixed;right:84px;bottom:64px;z-index:3;text-align:right;text-shadow:0 1px 10px rgba(0,0,0,.75)}
.clk .t{font-size:44px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.clk .d{margin-top:8px;font-size:20px;color:rgba(255,255,255,.72)}
.dock{position:fixed;left:50%;bottom:56px;z-index:4;transform:translate(-50%,40px);opacity:0;display:flex;align-items:flex-end;gap:34px;transition:opacity .3s,transform .3s}
body.ui .dock{opacity:1;transform:translate(-50%,0)}
.gap{width:10px}
body.ui .clk .d{opacity:0}
.clk .d{transition:opacity .3s}
.app{width:124px;text-align:center}
.app .ic{width:124px;height:124px;border-radius:28px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0C0D10;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .18s ease,box-shadow .18s ease}
.app .ic img{width:100%;height:100%;object-fit:cover}
.app .ic svg{width:54px;height:54px;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.app .nm{margin-top:16px;font-size:21px;color:rgba(255,255,255,.78);white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.8);transition:color .18s,transform .18s}
.app.on .ic{transform:scale(1.2) translateY(-8px);box-shadow:0 0 0 4px var(--ac),0 16px 40px rgba(0,0,0,.55)}
.app.on .nm{color:#fff;font-weight:600;transform:translateY(6px)}
.veil{position:fixed;inset:0;z-index:6;background:#000;opacity:0;pointer-events:none;transition:opacity .4s;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:300;letter-spacing:.5px}
.veil.on{opacity:.9}
.toast{position:fixed;left:50%;top:70px;z-index:7;transform:translateX(-50%);padding:18px 32px;border-radius:16px;background:rgba(0,0,0,.8);font-size:24px;opacity:0;transition:opacity .3s;max-width:1500px;text-align:center}
.toast.on{opacity:1}
.diag{position:fixed;inset:80px;z-index:8;background:rgba(0,0,0,.92);border-radius:20px;padding:40px;font-size:18px;line-height:1.5;overflow:hidden;display:none;white-space:pre-wrap;column-count:3}
.diag.on{display:block}
</style>
</head>

  function(err,reached){if(!reached&&tries<2){v.textContent=a.nm+' ne répond pas, nouvel essai…';setTimeout(attempt,1500);return;}
   v.className='veil';end();
   if(!reached){svcDown();return;}
   toast(hd?'Allume la manette '+a.nm+' : la télé bascule toute seule':a.nm+' : '+err,7000);})};attempt();}

function ping(){var px=new XMLHttpRequest();px.open('GET',SVC+'ping');px.timeout=4000;px.onload=function(){clearTimeout(pingT)};px.onerror=px.ontimeout=svcDown;px.send();}

 var x=new XMLHttpRequest();x.open('GET',SVC+'apps');x.timeout=6000;x.onload=function(){try{var r=JSON.parse(x.responseText);d.textContent='Applis installées :\n'+r.map(function(a){return a.name+'  ('+a.id+')'}).join('\n')}catch(e){d.textContent='Erreur'}};
 x.onerror=x.ontimeout=function(){d.textContent='Service Cosmos absent'};x.send();}
/* ---------- Télécommande ---------- */
try{['ChannelUp','ChannelDown','MediaPlayPause','ColorF0Red'].forEach(function(k){tizen.tvinputdevice.registerKey(k)})}catch(e){}
document.addEventListener('keydown',function(ev){var k=ev.keyCode,on=has('ui');
 if($('diag').className==='diag on'){$('diag').className='diag';ev.preventDefault();return;}
 if(k===403){diag();return;}
 if(k===427){show(pos+1);return;} if(k===428){show(pos-1);return;}
 if(k===10009||k===8||k===27){ev.preventDefault();if(on)ui(false);return;}
 cls('hello',false);
 if(launching)return;
 if(!on){ui(true);return;}
 if(k===37){sel=(sel+els.length-1)%els.length;ui(true);}
 else if(k===39){sel=(sel+1)%els.length;ui(true);}
 else if(k===38){ui(false);}
 else if(k===13){launch();ev.preventDefault();}
 else ui(true);
});
/* ---------- Démarrage ---------- */
show(pos);tick();setInterval(tick,15000);meteo();setInterval(meteo,1800000);hello();
var back=+(store('cosmos.ret')||0);store('cosmos.ret','0');
ui(true,back&&Date.now()-back<6*3600e3?20000:8000);
setTimeout(ping,1500);
document.addEventListener('visibilitychange',function(){if(document.hidden){cls('bg',true);clearTimeout(timer);}
 else{cls('bg',false);clearTimeout(timer);timer=setTimeout(function(){show(pos+1)},4000);if(+(store('cosmos.ret')||0)){store('cosmos.ret','0');ui(true,20000);}}});
